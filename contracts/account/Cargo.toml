[package]
name = "nftgram-account"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
overflow-checks = true

[package.metadata.stellar]
cargo_inherit = true

[dependencies]
soroban-sdk = "29.0.1"

[dev-dependencies]
soroban-sdk = { version = "29.0.1", features = ["testutils"] }
ed25519-dalek = "2.0.0"
